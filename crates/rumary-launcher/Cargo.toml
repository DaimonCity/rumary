[package]
name = "rumary-launcher"
version.workspace = true
edition.workspace = true

[dependencies]
eframe = "0.28"
egui = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-embed = "8"
confy = "0.6"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["serde", "v4"] }
sha2 = "0.10"
