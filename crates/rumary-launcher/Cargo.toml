[package]
name = "rumary-launcher"
version.workspace = true
edition.workspace = true
build = "build.rs"

[dependencies]
slint = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-embed = "8"
confy = "0.6"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["serde", "v4"] }
sha2 = "0.10"
log = "0.4.29"

[build-dependencies]
slint-build = "1"
