[package]
name = "rumary-launcher"
version.workspace = true
edition.workspace = true
build = "build.rs"

[dependencies]
slint = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-embed = "8"
confy = "0.6"
reqwest = { version = "0.13.2", features = ["json"] }
reqwest-retry = "0.9.1"
reqwest-middleware = "0.5.1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["serde", "v4"] }
sha2 = "0.11.0"
sha1 = "0.11.0"
hex = "0.4.3"
log = "0.4.29"
zip = "8.5.1"
bytes = "1.11.1"


[build-dependencies]
slint-build = "1"
